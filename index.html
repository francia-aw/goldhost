<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub m - منصة الذكاء الاصطناعي الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8a2be2; --primary-hover: #9b4dca; --accent: #00d2ff; --accent-glow: rgba(0, 210, 255, 0.5);
            --bg-gradient: linear-gradient(135deg, #09090e 0%, #161722 100%);
            --glass-bg: rgba(255, 255, 255, 0.04); --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff; --text-muted: #a0a0b0;
        }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-gradient); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        header { background: rgba(9, 9, 14, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 30px rgba(0,0,0,0.6); }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo h2 { margin: 0; font-weight: 900; background: linear-gradient(90deg, var(--accent), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }
        .balance-badge { background: rgba(138, 43, 226, 0.15); border: 1px solid var(--primary); padding: 6px 15px; border-radius: 20px; font-size: 15px; font-weight: 900; color: var(--accent); box-shadow: 0 0 15px rgba(138, 43, 226, 0.4); display: flex; gap: 8px; align-items: center;}
        
        nav button { background: transparent; border: none; color: var(--text-muted); font-family: 'Tajawal', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer; padding: 10px 18px; margin-right: 5px; border-radius: 12px; transition: all 0.3s ease; }
        nav button:hover, nav button.active-nav { color: var(--text-main); background: rgba(255,255,255,0.08); box-shadow: 0 0 15px rgba(255,255,255,0.05); }
        .btn-google { background: white; color: #1a1a1a; border-radius: 25px; padding: 10px 25px; display: flex; align-items: center; gap: 10px; font-weight: 900; box-shadow: 0 4px 15px rgba(255,255,255,0.2);}
        .btn-google:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,255,255,0.3); }
        
        .container { flex: 1; max-width: 900px; margin: 40px auto; width: 90%; background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5); }
        .page { display: none; animation: fadeIn 0.4s ease-out forwards; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        h1, h2 { color: var(--text-main); margin-top: 0; } p { color: var(--text-muted); line-height: 1.6; }
        textarea, input, select { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--glass-border); color: var(--text-main); font-family: 'Tajawal', sans-serif; padding: 18px; border-radius: 15px; margin-bottom: 20px; font-size: 16px; transition: all 0.3s; box-sizing: border-box;}
        select option { background: #161722; color: #fff; padding: 10px; }
        textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        
        .advanced-options { display: none; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; border: 1px solid var(--glass-border); }
        .option-group { flex: 1; min-width: 180px; }
        .option-group label { color: var(--accent); font-weight: bold; margin-bottom: 8px; display: block; }
        .option-group select { margin-bottom: 0; padding: 12px; }

        .action-btn { background: linear-gradient(45deg, var(--primary), var(--accent)); color: white; border: none; padding: 18px 30px; border-radius: 15px; font-size: 18px; font-weight: 900; cursor: pointer; width: 100%; transition: all 0.4s; box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3); text-transform: uppercase; }
        .action-btn:hover:not(:disabled) { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 30px rgba(0, 210, 255, 0.5); letter-spacing: 1px; }
        .action-btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; transform: none; background-image: none;}
        
        #aiOutput { margin-top: 35px; padding: 30px; background: rgba(0, 0, 0, 0.6); border-radius: 20px; border: 1px solid var(--glass-border); min-height: 120px; line-height: 1.9; font-size: 18px; text-align: right; position: relative; overflow-wrap: break-word; white-space: pre-wrap; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);}
        #aiOutput img, #aiOutput video { border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); border: 1px solid var(--glass-border); display: block; margin: 0 auto; }
        
        .progress-container { background: rgba(0,0,0,0.7); padding: 25px; border-radius: 15px; border: 1px solid var(--accent); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); text-align: center;}
        .progress-title { color: var(--accent); font-weight: 900; margin-bottom: 15px; font-size: 18px; text-shadow: 0 0 10px var(--accent-glow); }
        .progress-bar-bg { width: 100%; background: #222; border-radius: 10px; height: 22px; overflow: hidden; position: relative; border: 1px solid #444; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.4s ease; border-radius: 10px; position: relative; }
        .progress-bar-fill::after { content: ""; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        
        .plans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
        .plan-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); padding: 35px; border-radius: 20px; text-align: center; transition: all 0.3s; }
        .plan-card:hover { transform: translateY(-10px); background: rgba(255, 255, 255, 0.06); box-shadow: 0 15px 30px rgba(0,0,0,0.4);}
        .plan-card h3 { color: var(--accent); font-size: 32px; margin-bottom: 10px;}
        .discord-box { background: linear-gradient(135deg, #5865F2, #4752C4); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 15px 40px rgba(88, 101, 242, 0.5); position: relative; overflow: hidden; }
        .discord-box i { font-size: 55px; margin-bottom: 20px; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-microchip" style="color: var(--accent); font-size: 30px;"></i>
            <h2>AI Hub</h2>
            <div class="balance-badge" id="userBalanceDisplay" style="display:none;">
                <i class="fa-solid fa-gem"></i> <span id="ptsSpan">0</span>
            </div>
        </div>
        <nav>
            <button onclick="showPage('homePage')" class="active-nav"><i class="fa-solid fa-house"></i> الرئيسية</button>
            <button onclick="showPage('aiPage')" id="navAi" style="display:none;"><i class="fa-solid fa-wand-magic-sparkles"></i> الإستوديو</button>
            <button onclick="showPage('pricingPage')"><i class="fa-solid fa-cart-shopping"></i> الباقات</button>
            <button onclick="showPage('adminPage')" id="navAdmin" style="display:none; color:#ff5252;"><i class="fa-solid fa-shield-halved"></i> الإدارة</button>
            <button id="loginBtn" class="btn-google"><i class="fa-brands fa-google"></i> الدخول</button>
        </nav>
    </header>

    <div id="homePage" class="container page active">
        <div style="text-align: center; padding: 50px 0;">
            <i class="fa-brands fa-space-awesome" style="font-size: 110px; color: var(--accent); margin-bottom: 30px; text-shadow: 0 0 40px var(--accent-glow);"></i>
            <h1 style="font-size: 50px; margin-bottom: 20px; font-weight: 900;">مستقبلك يبدأ هنا</h1>
            <p style="font-size: 22px; max-width: 650px; margin: 0 auto; color: #ccc;">سجل دخولك الان واستمتع بأقوى نماذج الذكاء الاصطناعي (النصوص، الصور، والفيديو) في العالم.</p>
        </div>
    </div>

    <!-- الإستوديو -->
    <div id="aiPage" class="container page">
        <h2><i class="fa-solid fa-clapperboard"></i> إستوديو الإنشاء الشامل</h2>
        
        <select id="modelSelector">
            <optgroup label="نصوص (شغالة 100%)">
                <option value="gpt-4o" data-type="text" data-cost="50">GPT-4o (التكلفة: 50 نقطة)</option>
                <option value="claude-3-5-sonnet" data-type="text" data-cost="100">Claude 3.5 Sonnet (التكلفة: 100 نقطة)</option>
            </optgroup>
            <optgroup label="توليد الصور (جودة فائقة)">
                <option value="grok-imagine/text-to-image" data-type="image" data-cost="150">Grok Imagine (التكلفة: 150 نقطة)</option>
                <option value="flux" data-type="image" data-cost="120">Flux (التكلفة: 120 نقطة)</option>
                <option value="midjourney" data-type="image" data-cost="200">Midjourney (التكلفة: 200 نقطة)</option>
            </optgroup>
            <optgroup label="توليد الفيديو السينمائي">
                <option value="grok-video/generate" data-type="video" data-cost="600">Grok Video (التكلفة: 600 نقطة)</option>
                <option value="kling-video" data-type="video" data-cost="800">Kling Video (التكلفة: 800 نقطة)</option>
                <option value="runway-gen3" data-type="video" data-cost="1000">Runway Gen-3 (التكلفة: 1000 نقطة)</option>
            </optgroup>
        </select>

        <textarea id="aiInput" rows="5" placeholder="اكتب وصفك هنا بدقة... (ملاحظة: الصور والفيديو تتطلب وصفاً باللغة الإنجليزية لأفضل نتيجة)"></textarea>
        
        <div id="advancedOptions" class="advanced-options">
            <!-- المقاس -->
            <div id="aspectRatioDiv" class="option-group">
                <label><i class="fa-solid fa-crop-simple"></i> المقاس (الأبعاد):</label>
                <select id="aspectRatioSelector">
                    <option value="1:1">مربع (1:1)</option>
                    <option value="16:9">أفقي (16:9)</option>
                    <option value="9:16">رأسي (9:16)</option>
                    <option value="3:2">أفقي عريض (3:2)</option>
                </select>
            </div>
            
            <!-- عدد الصور -->
            <div id="imageCountDiv" class="option-group">
                <label><i class="fa-solid fa-images"></i> عايز كام صورة؟:</label>
                <select id="imageCountSelector">
                    <option value="1">1 صورة</option>
                    <option value="2">2 صورتين</option>
                    <option value="3">3 صور</option>
                    <option value="4">4 صور</option>
                </select>
            </div>
            
            <!-- مدة الفيديو -->
            <div id="videoDurationDiv" class="option-group">
                <label><i class="fa-solid fa-stopwatch"></i> مدة الفيديو:</label>
                <select id="videoDurationSelector">
                    <option value="5">5 ثواني (قياسي)</option>
                    <option value="10">10 ثواني (طويل)</option>
                </select>
            </div>
        </div>

        <button id="submitBtn" class="action-btn" onclick="generateAI()">تنفيذ الطلب <i class="fa-solid fa-wand-sparkles" style="margin-right: 8px;"></i></button>
        
        <div id="aiOutput">
            <div style="text-align: center; color: var(--text-muted); margin-top: 20px;">
                <i class="fa-solid fa-layer-group" style="font-size: 40px; margin-bottom: 15px;"></i><br>مساحة العرض الخاصة بك...
            </div>
        </div>
    </div>

    <!-- باقي الصفحات... -->
    <div id="pricingPage" class="container page">
        <h2 style="text-align: center; margin-bottom: 40px; font-weight: 900;">باقات الشحن</h2>
        <div class="plans-grid">
            <div class="plan-card">
                <h3>5$</h3>
                <p style="font-size: 26px; font-weight: 900; color: white;">5,000 <i class="fa-solid fa-gem" style="color: var(--primary);"></i></p>
            </div>
            <div class="plan-card" style="border-color: var(--accent); background: rgba(0, 210, 255, 0.05); box-shadow: 0 0 30px rgba(0,210,255,0.1);">
                <h3 style="color: var(--accent);">30$</h3>
                <p style="font-size: 26px; font-weight: 900; color: white;">25,000 <i class="fa-solid fa-gem" style="color: var(--accent);"></i></p>
            </div>
        </div>
        <div class="discord-box">
            <i class="fa-brands fa-discord"></i>
            <h2>لشحن رصيدك تواصل مع</h2>
            <h1 style="margin: 20px 0; font-family: monospace; letter-spacing: 4px; font-size: 38px; color: #fff;">kareem067468</h1>
        </div>
    </div>

    <div id="adminPage" class="container page">
        <div id="adminLogin" style="text-align: center;">
            <i class="fa-solid fa-shield-dog" style="font-size: 70px; color: #ff5252; margin-bottom: 25px;"></i>
            <h2>الإدارة المركزية</h2>
            <input type="password" id="adminPin" placeholder="رمز المرور السري" style="max-width: 350px; margin: 0 auto 20px; display: block; text-align: center;">
            <button class="action-btn" onclick="verifyAdmin()" style="max-width: 350px; background: #ff5252; box-shadow: 0 5px 20px rgba(255,82,82,0.4);">دخول</button>
        </div>
        <div id="adminPanel" style="display: none; border: 2px solid #ff5252; background: rgba(255, 82, 82, 0.08); padding: 40px; border-radius: 20px; margin-top: 20px;">
            <h2 style="color: #ff5252;"><i class="fa-solid fa-coins"></i> شحن المستخدمين</h2>
            <input type="email" id="targetEmail" placeholder="إيميل العميل">
            <input type="number" id="pointsToAdd" placeholder="النقاط">
            <button class="action-btn" onclick="addPointsToUser()" style="background: #ff5252; box-shadow: none;">إرسال الكوينات</button>
            <p id="adminMessage" style="margin-top: 20px; font-weight: bold; font-size: 20px; text-align: center;"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCU0JMGSBti6t8xolgEXSltkOr00aC4naM",
            authDomain: "goldhost-d3ab7.firebaseapp.com",
            projectId: "goldhost-d3ab7",
            storageBucket: "goldhost-d3ab7.firebasestorage.app",
            messagingSenderId: "662667965975",
            appId: "1:662667965975:web:e1cf683726961f98158e52"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let userPoints = 0;
        const ADMIN_EMAIL = "kareemwael0216@gmail.com";
        const ADMIN_PIN = "K_425422";
        const KIE_API_KEY = "1cb2291c2c38d8335da071e20ee5bdbc"; 

        window.showPage = (pageId) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
            document.getElementById(pageId).classList.add('active');
            event.currentTarget.classList.add('active-nav');
        }

        document.getElementById('modelSelector').addEventListener('change', function() {
            const type = this.options[this.selectedIndex].getAttribute('data-type');
            const advBox = document.getElementById('advancedOptions');
            const imgCount = document.getElementById('imageCountDiv');
            const vidDur = document.getElementById('videoDurationDiv');
            const aspectDiv = document.getElementById('aspectRatioDiv');
            
            if (type === 'image') {
                advBox.style.display = 'flex';
                aspectDiv.style.display = 'block';
                imgCount.style.display = 'block';
                vidDur.style.display = 'none';
            } else if (type === 'video') {
                advBox.style.display = 'flex';
                aspectDiv.style.display = 'block';
                imgCount.style.display = 'none';
                vidDur.style.display = 'block';
            } else {
                advBox.style.display = 'none';
            }
        });
        
        document.getElementById('modelSelector').dispatchEvent(new Event('change'));

        document.getElementById('loginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => alert("خطأ: " + err.message));
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('navAi').style.display = 'inline-block';
                document.getElementById('userBalanceDisplay').style.display = 'inline-flex';
                
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    userPoints = userSnap.data().points;
                } else {
                    await setDoc(userRef, { email: user.email, points: 0 });
                    userPoints = 0;
                }
                document.getElementById('ptsSpan').innerText = userPoints;
                
                if (user.email === ADMIN_EMAIL) { document.getElementById('navAdmin').style.display = 'inline-block'; }
            }
        });

        window.verifyAdmin = () => {
            const pin = document.getElementById('adminPin').value;
            if (pin === ADMIN_PIN && currentUser.email === ADMIN_EMAIL) {
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else { alert("❌ بيانات الإدارة غير صحيحة."); }
        }

        window.addPointsToUser = async () => {
            const email = document.getElementById('targetEmail').value;
            const points = parseInt(document.getElementById('pointsToAdd').value);
            if(!email || !points) return;

            const q = query(collection(db, "users"), where("email", "==", email));
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                document.getElementById('adminMessage').style.color = "#ff5252";
                document.getElementById('adminMessage').innerText = "❌ الحساب غير مسجل!";
                return;
            }

            querySnapshot.forEach(async (userDoc) => {
                const currentPts = userDoc.data().points;
                await updateDoc(doc(db, "users", userDoc.id), { points: currentPts + points });
                document.getElementById('adminMessage').style.color = "#00d2ff";
                document.getElementById('adminMessage').innerText = `✅ تم الشحن بنجاح لـ ${email}`;
                
                if(email === currentUser.email) {
                    userPoints += points;
                    document.getElementById('ptsSpan').innerText = userPoints;
                }
            });
        }

        // ================= أداة البحث العميق عن الروابط =================
        function extractMediaUrls(obj) {
            let urls = [];
            function searchObj(curr) {
                if (typeof curr === 'string' && curr.startsWith('http')) {
                    // نتجاهل روابط الأفاتار واللوجو لتجنب الأخطاء
                    if (!curr.toLowerCase().includes('avatar') && !curr.toLowerCase().includes('logo')) {
                        urls.push(curr);
                    }
                } else if (Array.isArray(curr)) {
                    curr.forEach(searchObj);
                } else if (curr !== null && typeof curr === 'object') {
                    for (let key in curr) { searchObj(curr[key]); }
                }
            }
            searchObj(obj);
            return [...new Set(urls)]; // إرجاع روابط فريدة بدون تكرار
        }

        window.generateAI = async () => {
            if (!currentUser) return alert("سجل الدخول أولاً");
            
            const selector = document.getElementById('modelSelector');
            const selectedOption = selector.options[selector.selectedIndex];
            const modelId = selectedOption.value;
            const modelType = selectedOption.getAttribute('data-type'); 
            const baseCost = parseInt(selectedOption.getAttribute('data-cost'));
            const promptText = document.getElementById('aiInput').value;
            
            if (!promptText.trim()) return alert("⚠️ اكتب وصف للطلب.");

            let finalCost = baseCost;
            let imageCount = 1;
            
            if (modelType === 'image') {
                imageCount = parseInt(document.getElementById('imageCountSelector').value) || 1;
                finalCost = baseCost * imageCount;
            }

            if (userPoints < finalCost) return alert(`❌ رصيدك لا يكفي. تكلفة هذا الطلب: ${finalCost} نقطة.`);

            const btn = document.getElementById('submitBtn');
            const output = document.getElementById('aiOutput');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري الإنشاء...';
            
            userPoints -= finalCost;
            document.getElementById('ptsSpan').innerText = userPoints;
            await updateDoc(doc(db, "users", currentUser.uid), { points: userPoints });

            try {
                if (modelType === "text") {
                    output.innerHTML = '<div style="text-align:center; padding: 20px;"><i class="fa-solid fa-atom fa-spin" style="font-size:50px; color:var(--primary); margin-bottom:15px;"></i><br><span style="color:var(--accent);">الذكاء الاصطناعي يفكر...</span></div>';
                    
                    const endpoint = "https://api.kie.ai/v1/chat/completions";
                    const payload = { model: modelId, messages: [{ role: "user", content: promptText }] };

                    const res = await fetch(endpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${KIE_API_KEY}` },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await res.json();
                    if (data.choices && data.choices[0] && data.choices[0].message) {
                        output.innerHTML = data.choices[0].message.content.replace(/\n/g, '<br>');
                    } else {
                        output.innerHTML = `<pre style="text-align:left; color:#0f0;">${JSON.stringify(data, null, 2)}</pre>`;
                    }
                    
                    btn.disabled = false;
                    btn.innerHTML = 'تنفيذ الطلب <i class="fa-solid fa-wand-sparkles" style="margin-right: 8px;"></i>';

                } else if (modelType === "image" || modelType === "video") {
                    
                    output.innerHTML = `<div class="progress-container"><div class="progress-title"><i class="fa-solid fa-layer-group fa-bounce"></i> جاري الإنتاج...</div><div class="progress-bar-bg"><div id="vidProgressFill" class="progress-bar-fill"></div></div><div id="vidProgressText" class="progress-text">0%</div></div>`;

                    const createEndpoint = "https://api.kie.ai/api/v1/jobs/createTask";
                    const payload = { 
                        model: modelId, 
                        input: {
                            prompt: promptText,
                            aspect_ratio: document.getElementById('aspectRatioSelector').value
                        }
                    };

                    if (modelType === 'image') payload.input.n = imageCount;
                    if (modelType === 'video') payload.input.duration = parseInt(document.getElementById('videoDurationSelector').value);

                    const startRes = await fetch(createEndpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${KIE_API_KEY}` },
                        body: JSON.stringify(payload)
                    });
                    
                    const startData = await startRes.json();
                    const taskId = startData.data?.taskId || startData.taskId || startData.id;
                    
                    if(!taskId) throw new Error("فشل بدء المهمة. " + JSON.stringify(startData));

                    let fakeProgress = 0;
                    
                    const checkStatus = async () => {
                        try {
                            const statRes = await fetch(`https://api.kie.ai/api/v1/jobs/recordInfo?taskId=${taskId}`, {
                                method: "GET",
                                headers: { "Authorization": `Bearer ${KIE_API_KEY}` }
                            });
                            
                            const statData = await statRes.json();
                            const taskData = statData.data || statData;

                            if (taskData.error) throw new Error(taskData.error.message);

                            let statStr = String(taskData.status || taskData.state || taskData.task_status || "").toUpperCase();
                            let isSuccess = ["SUCCESS", "COMPLETED", "FINISHED", "DONE", "SUCCEEDED"].includes(statStr) || taskData.successFlag === 1;
                            let isFailed = ["FAILED", "FAIL", "ERROR"].includes(statStr) || taskData.successFlag === 2 || taskData.successFlag === 3;

                            // الرادار الذكي: سحب جميع الروابط من السيرفر
                            let extractedUrls = extractMediaUrls(taskData);

                            if(fakeProgress < 92) fakeProgress += Math.floor(Math.random() * 4) + 1;
                            let currentProgress = taskData.progress || fakeProgress;
                            if(currentProgress > 95 && !isSuccess && extractedUrls.length === 0) currentProgress = 95;

                            document.getElementById('vidProgressFill').style.width = `${currentProgress}%`;
                            document.getElementById('vidProgressText').innerText = `${currentProgress}%`;

                            // إذا اكتملت المهمة أو تم العثور على روابط رغم عدم اكتمال النسبة
                            if (isSuccess || (extractedUrls.length > 0 && currentProgress >= 90)) {
                                
                                // تصفية الروابط للحصول على الميديا المطلوبة
                                let mediaUrls = extractedUrls.filter(u => u.match(/\.(mp4|webm|mov|png|jpg|jpeg|webp|gif)/i));
                                if(mediaUrls.length === 0) mediaUrls = extractedUrls; // لو مفيش امتداد، نعتمد كل الروابط
                                
                                if (mediaUrls.length > 0) {
                                    document.getElementById('vidProgressFill').style.width = `100%`;
                                    document.getElementById('vidProgressText').innerText = `100%`;
                                    
                                    // بناء كود الـ HTML لعرض الصور/الفيديوهات
                                    let outHtml = `<div style="display:flex; flex-wrap:wrap; gap:20px; justify-content:center; align-items:center; width: 100%;">`;
                                    
                                    mediaUrls.forEach(u => {
                                        if(modelType === 'video' || u.toLowerCase().match(/\.(mp4|webm|mov)$/)) {
                                            outHtml += `<div style="width:100%; max-width:800px; margin: 0 auto; text-align:center;">
                                                            <video controls autoplay loop src="${u}" style="max-width:100%; border-radius:15px; border:2px solid var(--primary);"></video>
                                                            <br><a href="${u}" target="_blank" class="btn-google" style="display:inline-flex; margin-top:15px;"><i class="fa-solid fa-cloud-arrow-down" style="margin-right:5px;"></i> تحميل الفيديو</a>
                                                        </div>`;
                                        } else {
                                            const flexBasis = mediaUrls.length === 1 ? '100%' : 'calc(50% - 10px)';
                                            outHtml += `<div style="flex: 1 1 ${flexBasis}; max-width:100%; text-align:center;">
                                                            <img src="${u}" style="max-width:100%; height:auto; border-radius:15px; border:1px solid var(--glass-border); box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
                                                            <br><a href="${u}" target="_blank" class="btn-google" style="display:inline-flex; margin-top:10px; font-size:14px; padding: 8px 15px;"><i class="fa-solid fa-download" style="margin-right:5px;"></i> تحميل</a>
                                                        </div>`;
                                        }
                                    });
                                    outHtml += `</div>`;
                                    
                                    setTimeout(() => {
                                        output.innerHTML = outHtml;
                                        btn.disabled = false;
                                        btn.innerHTML = 'تنفيذ الطلب <i class="fa-solid fa-wand-sparkles" style="margin-right: 8px;"></i>';
                                    }, 1000);

                                } else {
                                    throw new Error("المهمة اكتملت ولكن السيرفر لم يرسل مسار الملف. تفاصيل: " + JSON.stringify(taskData));
                                }
                            } else if (isFailed) {
                                throw new Error("فشل الرندر (الإنتاج) في السيرفر: " + (taskData.failReason || "تأكد من مطابقة الوصف لسياسات الموديل"));
                            } else {
                                setTimeout(checkStatus, 4000);
                            }
                        } catch (e) {
                            throw e;
                        }
                    };
                    setTimeout(checkStatus, 4000);
                }

            } catch (error) {
                console.error("System Error:", error);
                
                output.innerHTML = `<div style="background:rgba(255,82,82,0.1); border: 1px solid #ff5252; padding:20px; border-radius:15px; color:#ff5252; text-align:center;"><i class="fa-solid fa-triangle-exclamation" style="font-size:40px; margin-bottom:10px;"></i><br><b style="font-size:20px;">عذراً، حدث خطأ:</b><br><span style="color:#e0e0e0; font-size:15px; direction: ltr; display: block; margin-top: 10px; overflow-wrap: break-word;">${error.message}</span></div>`;
                
                // استرجاع الكوينات بأمان في حالة حدوث أي خطأ
                userPoints += finalCost;
                await updateDoc(doc(db, "users", currentUser.uid), { points: userPoints });
                document.getElementById('ptsSpan').innerText = userPoints;
                
                btn.disabled = false;
                btn.innerHTML = 'تنفيذ الطلب <i class="fa-solid fa-wand-sparkles" style="margin-right: 8px;"></i>';
            }
        }
    </script>
</body>
</html>
